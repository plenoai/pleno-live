version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Expo SDK が互換バージョンを管理するパッケージは Dependabot で上げない。
    # 個別に semver で上げると `expo install --check`（CI）が壊れるため、
    # 更新は `pnpm exec expo install --fix` で一括して行う。
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@types/react"
      - dependency-name: "eslint-config-expo"
      # vite は package.json の pnpm.overrides 経由で semver 判定を迂回し
      # minor/patch グループに major (6 → 8) が混入するため丸ごと除外する
      - dependency-name: "vite"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
