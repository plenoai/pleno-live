name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - canary

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check

      - name: Check iOS autolinking compatibility
        run: |
          if pnpm exec expo-modules-autolinking react-native-config --platform ios | grep -q "'react-native-svg'"; then
            echo "react-native-svg 15 is incompatible with React Native 0.85"
            exit 1
          fi

      - name: Type check
        run: pnpm check

      - name: Package Even G2 plugin
        run: pnpm even:g2:pack

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
