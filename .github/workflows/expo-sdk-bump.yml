name: Expo SDK bump

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: expo-sdk-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/expo-sdk-bump

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        id: check
        run: |
          if pnpm exec expo install --check; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix Expo dependencies
        if: steps.check.outputs.outdated == 'true'
        run: |
          pnpm exec expo install --fix
          pnpm install --no-frozen-lockfile

      - name: Open or update pull request
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "expo install --fix produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): align Expo SDK dependencies"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          body="Automated by the Expo SDK bump workflow: \`pnpm exec expo install --check\` reported outdated packages, so \`pnpm exec expo install --fix\` was applied and \`pnpm-lock.yaml\` regenerated."
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated existing pull request"
          else
            gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
              --title "chore(deps): align Expo SDK dependencies" --body "$body"
          fi
