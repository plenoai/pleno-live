name: sisakulint

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sisaku-security/sisakulint-action@8bfb3391a591a44a73b59acac86f8644112e383f  # v1.0.0
