name: Build Runner Image

on:
  workflow_dispatch:
  push:
    paths:
      - packages/infra/runner.Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::951872725222:role/pleno-live-github-actions
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Build and push runner image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/pleno-live-runner
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker build \
            -f packages/infra/runner.Dockerfile \
            -t $IMAGE:$IMAGE_TAG \
            packages/infra/
          docker push $IMAGE:$IMAGE_TAG
          echo "Image pushed: $IMAGE:$IMAGE_TAG"
